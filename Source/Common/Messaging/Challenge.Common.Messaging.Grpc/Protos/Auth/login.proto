syntax = "proto3";

package auth;

option csharp_namespace = "Challenge.Common.Messaging.Grpc";

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResult {
  string accessToken = 1;
  string refreshToken = 2;
}

message LoginResponse {
  LoginResult result = 1;
  bool success = 2;
  string errorMessage = 3;
}
