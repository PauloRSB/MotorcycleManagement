syntax = "proto3";

package auth;

option csharp_namespace = "Challenge.Common.Messaging.Grpc";

message RegisterUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  repeated string groupNames = 4;
}

message RegisterUserResponse {
  RegisterUserResult result = 1;
  bool success = 2;
  string errorMessage = 3;
}

message RegisterUserResult {
	string userId = 1;
}
